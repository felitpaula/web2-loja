<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Loja</title>
</head>
<body>
  <h1>Produtos</h1>

  <form id="form">
    <input name="nome" placeholder="Nome" required>
    <input name="preco" type="number" step="0.01" min="0" placeholder="Preço" required>
    <input name="estoque" type="number" min="0" value="0" required>
    <button>Salvar</button>
  </form>

  <table border="1" cellpadding="6">
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Preço</th><th>Estoque</th><th>Ação</th></tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>

<script>
  const corpo = document.getElementById('corpo');
  const form = document.getElementById('form');

  async function carregar() {
    const resp = await fetch('/produtos');
    const produtos = await resp.json();
    corpo.innerHTML = '';

    for (const p of produtos) {
      const tr = document.createElement('tr');

      const preco = Number(p.preco).toLocaleString('pt-BR',
        { style: 'currency', currency: 'BRL' });

      for (const valor of [p.id, p.nome, preco, p.estoque]) {
        const td = document.createElement('td');
        td.textContent = valor;
        tr.append(td);
      }

      const tdAcao = document.createElement('td');
      const btn = document.createElement('button');
      btn.textContent = 'Excluir';
      btn.addEventListener('click', async () => {
        await fetch('/produtos/' + p.id, { method: 'DELETE' });
        carregar();
      });
      tdAcao.append(btn);
      tr.append(tdAcao);

      corpo.append(tr);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const dados = Object.fromEntries(new FormData(form));
    await fetch('/produtos', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(dados),
    });
    form.reset();
    carregar();
  });

  carregar();
</script>
</body>
</html>
